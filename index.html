<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
  <head>
    <title>Lista de Tarefas</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="shortcut icon"
      href="assets/lista-de-tarefas.png"
      type="image/x-png"
    />

    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header>
      <nav class="navbar bg-warning-subtle">
        <div class="container">
          <a class="navbar-brand" href="#">
            <img
              src="assets/lista-de-tarefas.png"
              alt="Bootstrap"
              width="30"
              height="24"
            />
          </a>
        </div>
      </nav>
    </header>
    <main class="container py-4">
      <h1 class="h2 mb-3 text-center">Minhas <span class="text-warning">Tarefas</span></h1>

      <form id="form-tarefa" class="input-group container" novalidate>
        <input id="campo-tarefa" class="form-control" maxlength="80" aria-label="Nova tarefa" placeholder="O que precisa fazer?">
        <button class="btn btn-warning">Adicionar</button>
      </form>
      <p id="mensagem" class="text-danger small" aria-live="polite"></p>

      <ul id="lista" class="list-group my-3"></ul>
      <p id="contador" class="text-secondary"></p>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
